# ── patch. ───────────────────────────────────────────────────────────────────
# Runs the published images; nothing is built on this box. The installers (install/ in this repo,
# published to drunetic/rivet-kit-install) write this file and a .env beside it, log Docker in to
# GitHub's registry with the business's access code, and start it. Run compose from this folder.
#
# Settings are PATCH_*; the RIVET_* names from before the rename are still read. The database user
# and name stay `rivet`/`rivetkit`: they live inside existing data volumes, and nobody sees them.
#
# Developers building from source: docker compose -f docker-compose.yml -f compose.build.yml up --build
services:
  app:
    image: ${PATCH_IMAGE:-${RIVET_IMAGE:-ghcr.io/drunetic/patch}}:${PATCH_VERSION:-${RIVET_VERSION:-latest}}
    restart: unless-stopped
    # An explicit list rather than the whole .env: the internet-facing app has no business holding
    # the tunnel token or the database superuser settings. Add a line here for any new setting.
    environment:
      # Built from POSTGRES_PASSWORD so the password lives in one place. Set DATABASE_URL in .env
      # only for a Postgres outside this file.
      DATABASE_URL: ${DATABASE_URL:-postgres://rivet:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/rivetkit}
      DATABASE_SSL: ${DATABASE_SSL:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-0}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      PATCH_ACCESS_CODE: ${PATCH_ACCESS_CODE:-${RIVET_ACCESS_CODE:-}}
      PATCH_IMAGE: ${PATCH_IMAGE:-${RIVET_IMAGE:-ghcr.io/drunetic/patch}}
      PATCH_VERSION: ${PATCH_VERSION:-${RIVET_VERSION:-latest}}
      TZ: ${TZ:-Europe/London}
      DIGEST_HOUR: ${DIGEST_HOUR:-7}
      FILE_STORAGE_DIR: /data/files
      UPDATER_REQUEST_DIR: /data/updater-request
      UPDATER_STATUS_DIR: /data/updater-status
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - files:/data/files
      - updater-request:/data/updater-request
      - updater-status:/data/updater-status:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rivetkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet -d rivetkit"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nightly database dump and photo/logo archive into ./backups (scripts/backup.sh, inside the app
  # image). That folder is on the same disk as the data, so it is the first copy, not the backup:
  # sync it off the box.
  backup:
    image: ${PATCH_IMAGE:-${RIVET_IMAGE:-ghcr.io/drunetic/patch}}:${PATCH_VERSION:-${RIVET_VERSION:-latest}}
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/app/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: rivet
      PGDATABASE: rivetkit
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/London}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
      - files:/files
    depends_on:
      db:
        condition: service_healthy

  # Installs updates when an admin presses Update in Settings → Updates (scripts/updater.sh).
  # It holds the Docker socket, which is root on this box, so it has no ports and the app can only
  # leave it an "update" file in the request volume; the status volume is read-only to the app.
  # The compose folder is mounted at the same path as on the host so compose resolves ./backups
  # the same way, and Docker's login is mounted so it can pull with this business's access code.
  updater:
    image: ${PATCH_UPDATER_IMAGE:-${RIVET_UPDATER_IMAGE:-ghcr.io/drunetic/patch-updater}}:latest
    restart: unless-stopped
    environment:
      PROJECT_DIR: ${PWD}
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker:/root/.docker:ro
      - updater-request:/updater-request
      - updater-status:/updater-status

  # Cloudflare Tunnel connector. Off unless COMPOSE_PROFILES=tunnel, so a box on the LAN only, or
  # one behind another proxy, needs no token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [app]

volumes:
  pgdata:
  files:
  updater-request:
  updater-status:
