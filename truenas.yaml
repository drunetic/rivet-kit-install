# ── patch. for TrueNAS SCALE (24.10 or later) ─────────────────────────────────────────────
#
# You need three things from whoever runs patch HQ: your licence key (patch_…), HQ's address
# (hq.<domain>) and the images address (images.<domain>). The installers ask HQ for the third
# themselves; TrueNAS cannot, so ask for it with the key.
#
# 1. Apps → Configuration → Manage Container Image Registries (wording varies by version) → Add:
#      Registry: the images address    Username: licence    Password: your licence key
# 2. Apps → Discover Apps → ⋮ → Install via YAML. Name it patch and paste this file.
# 3. Before saving, replace every CHANGE-ME below:
#      CHANGE-ME-images-address (four times)    the images address, e.g. images.example.co.uk
#      CHANGE-ME-hq-address                     HQ's address, e.g. hq.example.co.uk
#      CHANGE-ME-licence-key                    the licence key
#      CHANGE-ME-database-password (three times) the same long random password each time,
#                                                letters and numbers only
#      CHANGE-ME-truenas-ip                     this TrueNAS box's address on your network
#      CHANGE-ME-pool                           the pool the backups dataset lives on
# 4. Open http://<truenas-ip>:3000 and the setup page makes the first account.
#
# Moving an install made with an access code (ghcr.io): add the registry in step 1, then in Apps →
# patch → Edit replace the two `image:` lines and add the three PATCH_ lines under the app's
# environment as below, and save. It downloads HQ's newest release; take a backup first.
#
# Updates: Settings → Updates in patch says when one is out; install it from TrueNAS
# (Apps → patch → Update, or Edit → Save to pull the latest image).
# Backups: nightly into the backups dataset below; snapshot or replicate that dataset off the box.
services:
  app:
    image: CHANGE-ME-images-address/patch:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://rivet:CHANGE-ME-database-password@db:5432/rivetkit
      # This install's licence: HQ's address and the key (Settings → Licence shows what HQ says).
      PATCH_HQ_URL: https://CHANGE-ME-hq-address
      PATCH_LICENCE_KEY: CHANGE-ME-licence-key
      PATCH_IMAGE: CHANGE-ME-images-address/patch
      PUBLIC_BASE_URL: http://CHANGE-ME-truenas-ip:3000
      FILE_STORAGE_DIR: /data/files
      TZ: Europe/London
      # Behind a Cloudflare Tunnel, set these, uncomment `networks:` below the volumes and the
      # tunnel section at the bottom:
      # PUBLIC_BASE_URL: https://kit.yourdomain.co.uk
      # TRUST_CLOUDFLARE_HEADERS: "1"
    ports:
      - "3000:3000"
    volumes:
      - files:/data/files
    # networks: [default, tunnel]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: CHANGE-ME-database-password
      POSTGRES_DB: rivetkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet -d rivetkit"]
      interval: 5s
      timeout: 3s
      retries: 20

  backup:
    image: CHANGE-ME-images-address/patch:latest
    pull_policy: always
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/app/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: rivet
      PGDATABASE: rivetkit
      PGPASSWORD: CHANGE-ME-database-password
      TZ: Europe/London
      BACKUP_HOUR: "3"
      BACKUP_KEEP_DAYS: "30"
    volumes:
      # A dataset you can snapshot and replicate, e.g. /mnt/tank/patch/backups
      - /mnt/CHANGE-ME-pool/patch/backups:/backups
      - files:/files
    depends_on:
      db:
        condition: service_healthy

  # Behind a Cloudflare Tunnel: uncomment these two services, `networks:` on the app above and the
  # networks block at the bottom. Add the gate on any TrueNAS app with a tunnel: there is no updater
  # here to warn when it is missing. The gate shuts the
  # connector in with patch: however the tunnel is set up in Cloudflare, it cannot reach this box,
  # your network or any other app. Without the gate it could reach all of them.
  # tunnel-gate:
  #   image: CHANGE-ME-images-address/patch-updater:latest
  #   restart: unless-stopped
  #   entrypoint: ["/bin/sh", "/tunnel-gate.sh"]
  #   cap_add: [NET_ADMIN]
  #   dns: [1.1.1.1, 1.0.0.1]
  #   tmpfs: [/run/gate]
  #   networks: [tunnel]
  #   healthcheck:
  #     test: ["CMD", "test", "-f", "/run/gate/ready"]
  #     interval: 3s
  #     retries: 20
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate --edge-ip-version 4 run
  #   environment:
  #     TUNNEL_TOKEN: paste the token (the eyJ… part of Cloudflare's docker command)
  #   network_mode: service:tunnel-gate
  #   depends_on:
  #     tunnel-gate:
  #       condition: service_healthy
  #     app:
  #       condition: service_started

# networks:
#   default:
#   tunnel:

volumes:
  pgdata:
  files:
